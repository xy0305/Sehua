name: Build IPA

on:
  push:
    branches: [ main, 'recovery/115-evidence-*' ]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=""
          for p in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode_26.app \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app; do
            if [ -d "$p" ]; then XCODE="$p"; break; fi
          done
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$XCODE" ]; then
            echo "Xcode not found. Installed:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Read-only per-link task progress regression
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/ProgressFixtures.swift -o /tmp/progress-fixtures
          /tmp/progress-fixtures

      - name: TLS read-only fallback and unknown-write regression
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/TLSFixtures.swift -o /tmp/tls-fixtures
          /tmp/tls-fixtures

      - name: Read-only pending recovery and sanitized diagnostics regression
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/RecoveryFixtures.swift -o /tmp/recovery-fixtures
          /tmp/recovery-fixtures

      - name: Original file playback production regression
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/PlaybackFixtures.swift -o /tmp/playback-fixtures
          /tmp/playback-fixtures

      - name: Thread purchase evidence production fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Parser/HTML.swift SeHuaTang/Parser/DiscuzParser.swift SeHuaTang/Models/Models.swift SeHuaTang/Config/SiteConfig.swift Regression115/PurchaseFixtures.swift -o /tmp/purchase-fixtures
          /tmp/purchase-fixtures

      - name: Production parser regression tests
        run: |
          xcrun swiftc -D PARSER_REGRESSION_TESTS SeHuaTang/Parser/HTML.swift SeHuaTang/Parser/DiscuzParser.swift SeHuaTang/Models/Models.swift SeHuaTang/Config/SiteConfig.swift -o /tmp/sehua-parser-tests
          /tmp/sehua-parser-tests

      - name: Resource link extraction fixtures
        run: |
          python3 Regression115/AttachmentHTTPFixture.py > /tmp/attachment-http.log 2>&1 &
          FIXTURE_PID=$!
          trap 'cat /tmp/attachment-http.log; kill "$FIXTURE_PID"' EXIT
          curl --noproxy '*' --retry 3 --retry-connrefused --max-time 10 -f http://127.0.0.1:18763/ed2k > /dev/null
          xcrun swiftc -parse-as-library SeHuaTang/Models/Models.swift SeHuaTang/Parser/HTML.swift SeHuaTang/Integration115/ResourceLinkExtractor.swift SeHuaTang/Integration115/SmallArchiveReader.swift Regression115/ResourceLinkExtractorFixtures.swift -o /tmp/resource-link-fixtures
          /tmp/resource-link-fixtures

      - name: Content completeness fixtures
        run: |
          xcrun swiftc SeHuaTang/Parser/HTML.swift SeHuaTang/Parser/DiscuzParser.swift SeHuaTang/Models/Models.swift SeHuaTang/Config/SiteConfig.swift Regression115/ContentFixtures.swift -o /tmp/content-fixtures
          /tmp/content-fixtures

      - name: Body hyperlink and native routing fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Parser/HTML.swift SeHuaTang/Models/SiteRoute.swift SeHuaTang/Config/SiteConfig.swift Regression115/BodyLinkFixtures.swift -o /tmp/body-link-fixtures
          /tmp/body-link-fixtures

      - name: Animated signature and decoding fixtures
        run: |
          xcrun swiftc -parse-as-library Regression115/AnimatedImageFixtures.swift -o /tmp/animated-fixtures
          /tmp/animated-fixtures

      - name: Offline submission fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/SubmissionFixtures.swift -o /tmp/submission-fixtures
          /tmp/submission-fixtures

      - name: Stable pagination contract production fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/PagingFixtures.swift -o /tmp/paging-fixtures
          /tmp/paging-fixtures

      - name: Listing safety and 52-54 production comparison
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/ListingFixtures.swift -o /tmp/listing-fixtures
          /tmp/listing-fixtures
          for VERSION in 52 54; do
            mkdir -p /tmp/baseline-$VERSION
            if [ "$VERSION" = 52 ]; then REF=ca753eebdd4d9af3c1d4126f4d00de9c8500ef7a; else REF=36465b88c1d0b25ff3d8d1e3dc6edb02158d1ca5; fi
            for FILE in SeHuaTang/Integration115/SHT115*.swift; do
              git show "$REF:$FILE" > "/tmp/baseline-$VERSION/$(basename "$FILE")"
            done
            xcrun swiftc -parse-as-library -D BASELINE_LISTING -D VERSION$VERSION /tmp/baseline-$VERSION/*.swift Regression115/ListingFixtures.swift -o /tmp/listing-$VERSION
            /tmp/listing-$VERSION
          done

      - name: Submission performance controlled latency fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/PerformanceFixtures.swift -o /tmp/performance-fixtures
          /tmp/performance-fixtures

      - name: Directory and extraction fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/ExtractionFixtures.swift -o /tmp/extraction-fixtures
          /tmp/extraction-fixtures

      - name: Sequential push concurrency fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/SequenceFixtures.swift -o /tmp/sequence-fixtures
          /tmp/sequence-fixtures

      - name: Guarded archive recycle mock fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/CleanupFixtures.swift -o /tmp/cleanup-fixtures
          /tmp/cleanup-fixtures

      - name: Native sign and favorite protocol fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Parser/HTML.swift SeHuaTang/Network/NativeActionProtocol.swift Regression115/NativeActionFixtures.swift -o /tmp/native-action-fixtures
          /tmp/native-action-fixtures

      - name: Native purchase protocol fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Parser/HTML.swift SeHuaTang/Network/NativePurchaseProtocol.swift Regression115/NativePurchaseFixtures.swift -o /tmp/native-purchase-fixtures
          /tmp/native-purchase-fixtures

      - name: Native reply production protocol fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Parser/HTML.swift SeHuaTang/Network/NativeReplyProtocol.swift Regression115/NativeReplyFixtures.swift -o /tmp/native-reply-fixtures
          /tmp/native-reply-fixtures

      - name: Live-derived account parser fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Parser/HTML.swift SeHuaTang/Models/Models.swift SeHuaTang/Parser/SiteAccountParser.swift Regression115/SiteAccountFixtures.swift -o /tmp/account-fixtures
          /tmp/account-fixtures

      - name: Forum directory expansion policy fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Config/SiteConfig.swift SeHuaTang/Models/Models.swift SeHuaTang/Parser/HTML.swift SeHuaTang/Parser/DiscuzParser.swift SeHuaTang/Models/ForumDirectoryState.swift Regression115/ForumDirectoryFixtures.swift -o /tmp/forum-directory-fixtures
          /tmp/forum-directory-fixtures

      - name: Production presentation timing fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Models/PresentationTiming.swift Regression115/PresentationTimingFixtures.swift -o /tmp/presentation-fixtures
          /tmp/presentation-fixtures

      - name: Build unsigned (iphoneos)
        run: |
          set -euo pipefail
          xcodebuild \
            -project SeHuaTang.xcodeproj \
            -scheme SeHuaTang \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            build

      - name: Package IPA
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products -path '*/Release-iphoneos/*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP" && test -d "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          find Payload -name '*.xcent' -delete || true
          find Payload -name 'embedded.mobileprovision' -delete || true
          VERSION=$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);/\1/p' SeHuaTang.xcodeproj/project.pbxproj | head -1)
          BUILD=$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([0-9]*\);/\1/p' SeHuaTang.xcodeproj/project.pbxproj | head -1)
          echo "project version $VERSION ($BUILD)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Payload/SeHuaTang.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Payload/SeHuaTang.app/Info.plist
          NAME="SeHuaTang-unsigned-${VERSION}-${BUILD}.ipa"
          zip -qry "$NAME" Payload
          ls -lh "$NAME"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload IPA
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SeHuaTang-unsigned-ipa
          path: SeHuaTang-unsigned-*.ipa
          if-no-files-found: error
