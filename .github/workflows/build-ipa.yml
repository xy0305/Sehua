name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=""
          for p in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode_26.app \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app; do
            if [ -d "$p" ]; then XCODE="$p"; break; fi
          done
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$XCODE" ]; then
            echo "Xcode not found. Installed:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Production parser regression tests
        run: |
          xcrun swiftc -D PARSER_REGRESSION_TESTS SeHuaTang/Parser/HTML.swift SeHuaTang/Parser/DiscuzParser.swift SeHuaTang/Models/Models.swift SeHuaTang/Config/SiteConfig.swift -o /tmp/sehua-parser-tests
          /tmp/sehua-parser-tests

      - name: Resource link extraction fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Models/Models.swift SeHuaTang/Parser/HTML.swift SeHuaTang/Integration115/ResourceLinkExtractor.swift SeHuaTang/Integration115/SmallArchiveReader.swift Regression115/ResourceLinkExtractorFixtures.swift -o /tmp/resource-link-fixtures
          /tmp/resource-link-fixtures

      - name: Content completeness fixtures
        run: |
          xcrun swiftc SeHuaTang/Parser/HTML.swift SeHuaTang/Parser/DiscuzParser.swift SeHuaTang/Models/Models.swift SeHuaTang/Config/SiteConfig.swift Regression115/ContentFixtures.swift -o /tmp/content-fixtures
          /tmp/content-fixtures

      - name: Offline submission fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/SubmissionFixtures.swift -o /tmp/submission-fixtures
          /tmp/submission-fixtures

      - name: Directory and extraction fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/ExtractionFixtures.swift -o /tmp/extraction-fixtures
          /tmp/extraction-fixtures

      - name: Sequential push concurrency fixtures
        run: |
          xcrun swiftc -parse-as-library SeHuaTang/Integration115/SHT115*.swift Regression115/SequenceFixtures.swift -o /tmp/sequence-fixtures
          /tmp/sequence-fixtures

      - name: Build unsigned (iphoneos)
        run: |
          set -euo pipefail
          xcodebuild \
            -project SeHuaTang.xcodeproj \
            -scheme SeHuaTang \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products -path '*/Release-iphoneos/*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP" && test -d "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          find Payload -name '*.xcent' -delete || true
          find Payload -name 'embedded.mobileprovision' -delete || true
          VERSION=$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);/\1/p' SeHuaTang.xcodeproj/project.pbxproj | head -1)
          BUILD=$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([0-9]*\);/\1/p' SeHuaTang.xcodeproj/project.pbxproj | head -1)
          echo "project version $VERSION ($BUILD)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Payload/SeHuaTang.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Payload/SeHuaTang.app/Info.plist
          NAME="SeHuaTang-unsigned-${VERSION}-${BUILD}.ipa"
          zip -qry "$NAME" Payload
          ls -lh "$NAME"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SeHuaTang-unsigned-ipa
          path: SeHuaTang-unsigned-*.ipa
          if-no-files-found: error
